# 内容过滤的出厂规则。
#
# **放在 YAML 里而不是硬编码**，和 rules.yaml 同一个理由：这个列表会跟着新的写法
# 演进。两个网关共用这一份。
#
# 每条规则：
#
# - `id`：配置按它引用，**改了就是另一条规则**；
# - `name` / `name_zh`：英文名、中文名。**名字和说明只在这里写一份**，两个产品的界面都
#   显示规则视图带过去的文字；
# - `match`：`contains`（不分大小写的子串）、`regex`（不分大小写的正则）或
#   `codepoints`（按字符本身认，写成 `U+200B`、`U+E0000–U+E007F`）。
#   `contains` 的首尾空格有意义（` dan ` 靠它不误伤 `dance`）；
# - `action`：出厂的处置，`block`（拒绝）/ `strip`（删除）/ `record`（仅记录）；
# - `group`：`invisible`（隐藏字符）/ `injection`（覆盖指令的说法）/ `persona`
#   （改换身份、套提示词）/ `chinese`（中文的说法）；
# - `on_by_default`：出厂时开不开。**只开误报极少的那几条** —— 「act as」
#   「system prompt」在写代码的对话里天天出现，出厂就开等于让记录变成噪音；
# - `why` / `why_zh`：规则名说不清的，一句说明，英文、中文。
#
# `kinds` 是分组的名字，界面按这个顺序分组；`group` 写其中一个。用户自己加的规则在
# 「自定义」组，那个组的名字和另两项防护共用，在 redact.yaml 里。
#
# 隐藏字符一组排在最前：人眼看不见、模型读得到的字符。出厂开着的只有标签字符和双向
# 控制符 —— 它们在任何正文里都没有正当用途；零宽字符和私用区字符在正常文字里也有
# （表情、波斯文、图标字体），出厂关着。

kinds:
  - slug: invisible
    name: Hidden characters
    name_zh: 隐藏字符
  - slug: injection
    name: Instruction override
    name_zh: 指令覆盖
  - slug: persona
    name: Identity and prompts
    name_zh: 身份与提示词
  - slug: chinese
    name: Chinese phrasing
    name_zh: 中文说法

rules:
  - id: unicode-tags
    name: Unicode tag characters
    name_zh: Unicode 标签字符
    pattern: 'U+E0000–U+E007F'
    match: codepoints
    action: strip
    group: invisible
    on_by_default: true
    why: Entirely invisible in an editor, yet carried into the model's context as they are, so they can hide a whole instruction.
    why_zh: 在编辑器中完全不可见，但会原样进入模型上下文，可用于隐藏整段指令。
  - id: bidi-controls
    name: Bidirectional controls
    name_zh: 双向控制符
    pattern: 'U+202A–U+202E, U+2066–U+2069'
    match: codepoints
    action: strip
    group: invisible
    on_by_default: true
    why: They can make the order shown on screen differ from the actual order of the characters.
    why_zh: 可使屏幕上的显示顺序与实际字符顺序不一致。
  - id: zero-width
    name: Zero-width characters
    name_zh: 零宽字符
    pattern: 'U+200B–U+200D, U+2060, U+FEFF'
    match: codepoints
    action: strip
    group: invisible
    why: Invisible in an editor, and read by the model. Emoji, Persian and other ordinary writing use them too.
    why_zh: 在编辑器中不可见，但会被模型读到。表情符号、波斯文等正常文字也会用到。
  - id: private-use
    name: Private-use characters
    name_zh: 私用区字符
    pattern: 'U+E000–U+F8FF, U+F0000–U+FFFFD, U+100000–U+10FFFD'
    match: codepoints
    action: strip
    group: invisible
    why: They have no standard meaning. Some icon fonts use them.
    why_zh: 没有标准含义。部分图标字体会用到。

  - id: ignore-previous-instructions
    name: Ignore previous instructions
    name_zh: 要求忽略先前的指令
    pattern: 'ignore previous instructions'
    match: contains
    action: block
    group: injection
    on_by_default: true
  - id: ignore-all-previous
    name: Ignore all previous
    name_zh: 要求忽略之前的全部内容
    pattern: 'ignore all previous'
    match: contains
    action: block
    group: injection
    on_by_default: true
  - id: disregard-your-instructions
    name: Disregard your instructions
    name_zh: 要求无视指令
    pattern: 'disregard your instructions'
    match: contains
    action: block
    group: injection
    on_by_default: true
  - id: jailbreak
    name: Jailbreak
    name_zh: 越狱
    pattern: 'jailbreak'
    match: contains
    action: block
    group: injection
  - id: dan
    name: DAN
    name_zh: DAN
    pattern: ' dan '
    match: contains
    action: block
    group: injection
  - id: developer-mode
    name: Developer mode
    name_zh: 开发者模式
    pattern: 'developer mode'
    match: contains
    action: block
    group: injection

  - id: you-are-now
    name: Persona manipulation
    name_zh: 重新设定身份
    pattern: 'you are now'
    match: contains
    action: block
    group: persona
  - id: new-persona
    name: New persona
    name_zh: 新的人设
    pattern: 'new persona'
    match: contains
    action: record
    group: persona
  - id: act-as
    name: Act as
    name_zh: 要求扮演角色
    pattern: 'act as'
    match: contains
    action: record
    group: persona
  - id: pretend-to-be
    name: Pretend to be
    name_zh: 要求假装身份
    pattern: 'pretend to be'
    match: contains
    action: record
    group: persona
  - id: system-prompt
    name: System prompt extraction
    name_zh: 索取系统提示词
    pattern: 'system prompt'
    match: contains
    action: record
    group: persona
  - id: reveal-your-instructions
    name: Reveal instructions
    name_zh: 要求透露指令
    pattern: 'reveal your instructions'
    match: contains
    action: record
    group: persona
  - id: what-are-your-rules
    name: What are your rules
    name_zh: 询问规则
    pattern: 'what are your rules'
    match: contains
    action: record
    group: persona
  - id: base64-wall
    name: Base64 smuggling
    name_zh: 长串 Base64
    pattern: '[A-Za-z0-9+/=]{50,}'
    match: regex
    action: record
    group: persona

  - id: zh-ignore-previous
    name: Ignore previous instructions (Chinese)
