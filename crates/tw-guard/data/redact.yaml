# 出站脱敏的内置规则目录。
#
# Core 提供稳定的规则 ID 和英文说明，客户端按 ID 查自己的译文。
#
# 编译时由 build.rs 读进来，生成 `rules::BUILTINS`（`&'static [Builtin]`）：快速排除的
# `KEY_MIN` / `KEY_FIRST` 是对着 BUILTINS 在编译期算的常量，目录必须在编译期就定下来。
# 写错了（字段拼错、少写说明、判据不认识）是编译错误，不会等到运行时。
#
# # 分组（`kinds`）
#
# 界面按这个顺序分组，和 `Kind` 的定义顺序一致（测试钉着）。`custom` 是用户自己写的规则，
# 三项防护的「自定义」组都用这里的名字。
#
# # 规则（`rules`）
#
# **顺序有意义**：同一组里界面按这里的顺序排；前缀表也按这里的顺序比，先对上的那条算数。
#
# - `id`：配置按它引用、命中之后报出去的也是它，**改了就是另一条规则**；
# - `kind`：分组，`kinds` 里的一个；
# - `on_by_default`：出厂开不开，不写是关。**写漏了是「没开」**，宁可漏，不可吵；
# - `label`：占位符里的标签（`TW_ID_NUMBER`），不写用账本的默认标签；
# - `name`：英文名；
# - `about`：认什么，给人看的一句话。按位置认的写明只换哪一段。反引号括起来的
#   一段界面按代码样式显示；
# - `hosts`：这把凭据正当地会送往哪些服务商域名（后缀匹配，含子域）。危险命令「凭据发往
#   陌生主机」用它：没写的（私钥、加密货币私钥）送往任何非本机地址都算外传。**别写人人都能
#   开一个子域的共享域名**（对象存储的 bucket、云函数、Webhook 都在服务商的大域名下）：写了
#   就等于放行发往别人的 bucket。有专门 API 主机的写那个主机；
#   **仍按大域名放行、尚未收窄的**（服务本身就用到大域名下的各个产品，或者正当的去处就是
#   用户自己的子域，收窄了天天误切）：`amazonaws.com`（S3、API Gateway）、`aliyuncs.com`
#   （阿里云 AccessKey，OSS）、`googleapis.com` / `google.com`（Cloud Storage、Apps Script）、
#   `slack.com`（hooks.slack.com 的 Webhook）、`myshopify.com`、`atlassian.net`、
#   `supabase.co`、`grafana.net`、`jfrog.io`、`sentry.io`、`databricks.com` /
#   `azuredatabricks.net`、`hashicorp.cloud`（每个用户一个子域）；
# - 判据，三选一：
#   - `prefix: { prefix, min_tail }`：以 `prefix` 开头、其后至少 `min_tail` 个字符；
#   - `prefixes: [{ prefix, min_tail, tail }]`：以其中任一个开头，`tail` 是尾巴允许的字符，
#     `any`（不写）/ `hex` / `alnum`。同一家服务的几种令牌写成一条；
#   - 两样都不写：判据在代码里（校验位、词表、位置……），按 `id` 在 `rules::DETECTORS`
#     里找。数据和代码两边对不上是编译错误 / 测试失败。
#
#   **前缀类的规则不写 `about`**：说明由 build.rs 按前缀和长度生成，和判据不会说两样。
#   加一条前缀类的规则只改这个文件。
#
# 凭据规则按前缀、结构或字段位置识别。UUID、裸十六进制和链上地址另作隐私规则，
# 不把这些无从区分用途的格式单独当成密钥外传证据。

