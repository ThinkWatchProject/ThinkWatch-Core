    kind: business
    on_by_default: true
    name: Atlassian API token
    prefixes:
      - { prefix: 'ATATT3', min_tail: 150 }
    hosts: [atlassian.net, atlassian.com]

  # 按位置认的：只换值那一段
  - id: auth-header-credential
    kind: in-context
    on_by_default: true
    name: Credential in a request header
    about: 'The value of an `Authorization`, `X-Api-Key`, `Api-Key` or `X-Goog-Api-Key` header, in curl `-H`, raw HTTP or code; only the value is replaced'
  - id: command-line-password
    kind: in-context
    on_by_default: true
    name: Password on a command line
    about: 'Passwords on a command line: `curl -u user:password`, `--user`, `mysql -ppassword`, `PGPASSWORD=… psql`; only the password is replaced'
  - id: url-token
    kind: in-context
    on_by_default: true
    name: Token in a URL
    about: 'The value of the URL query parameter `access_token`, `api_key`, `apikey`, `client_secret`, `sig`, `X-Amz-Signature` or `X-Goog-Signature`; only the parameter value is replaced'
  - id: bot-webhook
    kind: in-context
    on_by_default: true
    name: Bot webhook
    about: 'The token in a Feishu / Lark, DingTalk, WeCom, Slack, Discord or Microsoft Teams bot webhook URL; only the token is replaced'
  - id: telegram-bot-token
    kind: in-context
    on_by_default: true
    name: Telegram bot token
    about: '8 to 10 digits and `:AA`, followed by 33 characters'
  - id: config-assignment
    kind: in-context
    on_by_default: true
    name: Secret assigned in a config file
    about: 'Assignments in `.env`, YAML, TOML, INI or JSON whose variable name ends in `SECRET`, `SECRET_KEY`, `PASSWORD`, `PASSWD`, `PWD`, `TOKEN`, `API_KEY`, `APIKEY`, `ACCESS_KEY`, `PRIVATE_KEY` or `CLIENT_SECRET` (ignoring case) and whose value is a literal of at least 8 characters; only the value is replaced. Expressions, variable references and placeholders do not count'

  # 加密货币
  - id: crypto-mnemonic
    kind: crypto
    on_by_default: true
    name: Recovery phrase
    about: '12, 15, 18, 21 or 24 consecutive words from the BIP39 English or Simplified Chinese word list that pass the checksum; numbering allowed, replaced as a whole'
  - id: crypto-wif-key
    kind: crypto
    on_by_default: true
    name: WIF private key
    about: 'A WIF private key of 51 or 52 characters that passes Base58Check with a valid version byte'
  - id: crypto-extended-key
    kind: crypto
    on_by_default: true
    name: Extended private key
    about: 'BIP32 / SLIP-0132 extended private keys: `xprv`, `tprv`, `yprv`, `Yprv`, `zprv`, `Zprv`, `uprv`, `Uprv`, `vprv` or `Vprv`; valid Base58Check, private marker and secp256k1 scalar'


  - id: uuid
    kind: device
    on_by_default: true
    name: UUID / compact identifier
    about: 'Hyphenated UUIDs and 32 hexadecimal characters, ignoring case and without version restrictions, including order and trace IDs; compact hashes of the same shape are also replaced'
  - id: crypto-hex-key
    kind: crypto
    on_by_default: true
    name: Raw wallet key / 32-byte hash
    about: '64 hexadecimal characters with an optional `0x` prefix; covers EVM and TRON private keys as well as indistinguishable transaction hashes and digests'
  - id: crypto-solana-key
    kind: crypto
    on_by_default: true
    name: Solana keypair
    about: '64-byte Ed25519 seed and public key encoded as Base58 or a pasted JSON byte array; the public half must match the seed, excluding signatures of the same length'
  - id: crypto-sui-key
    kind: crypto
    on_by_default: true
    name: Sui private key
    about: '`suiprivkey1` Bech32 encoding with a valid checksum, a supported signature scheme and 32 key bytes'
  - id: crypto-stellar-key
    kind: crypto
    on_by_default: true
    name: Stellar secret seed
    about: 'Stellar `S` StrKey seed with the correct version, 32-byte payload and CRC16-XModem checksum'
  - id: crypto-xrp-seed
    kind: crypto
    on_by_default: true
    name: XRP family seed
    about: 'XRP-alphabet Base58Check family seeds, including secp256k1 and Ed25519 version encodings'
  - id: crypto-address
    kind: financial
    on_by_default: true
    name: Blockchain account / extended public key
    about: 'EVM hex addresses, checksummed Bitcoin/TRON/XRP/Stellar addresses, Bitcoin witness addresses and BIP32 / SLIP-0132 extended public keys; also 32-byte Base58 account shapes such as Solana, which lack a checksum'
  - id: crypto-secret-field
    kind: in-context
    on_by_default: true
    name: Wallet secret in a field
    about: 'Literal private keys, seeds, mnemonic/recovery phrases, passphrases, recovery codes and MPC/backup shares in named fields, including `pk`, `privateKey`, `PRIVY_WALLET_PRIVATE_KEY` and Chinese labels; only the value is replaced, with no guessed key length'
  - id: exchange-credential
    kind: in-context
    on_by_default: true
    name: Trading API / signed authentication credential
    about: 'Literal API keys, secrets, passphrases, signing memos, OTPs and authentication signatures in SDK/config fields or trading headers; Binance, OKX, Bybit, Coinbase, Kraken, KuCoin, Bitget, Gate, MEXC, Gemini, Bitfinex, HTX, BitMart, Phemex, Bitstamp, Polymarket and predict.fun; only the value is replaced'
  - id: crypto-keystore
    kind: in-context
    on_by_default: true
    name: Wallet keystore / ciphertext
    about: 'Literal `keystore` or `ciphertext` fields, including Ethereum V3 encrypted key material; pasted JSON objects are protected as text and only the value is replaced'
  - id: crypto-rpc-key
    kind: in-context
    on_by_default: true
    name: Blockchain RPC URL credential
    about: 'API credentials in Infura `/v3/`, Alchemy `/v2/`, QuickNode token paths and Helius `api-key` URLs; only the credential part is replaced'

  # ---- 扩充的个人信息规则（判据在 src/redact/personal/）
  - id: cn-resident-id-15
    kind: id-documents
    label: TW_ID_NUMBER
    name: 15-digit legacy resident ID number
    about: 'A 15-digit legacy resident ID number with a valid region code and 6-digit birth date, followed by a 3-digit sequence'
  - id: passport-mrz
    kind: id-documents
    on_by_default: true
    label: TW_PASSPORT
    name: Passport machine-readable zone
    about: 'Two lines of 44 characters starting with `P`, with all four check digits and the composite check digit correct; replaced as a whole'
  - id: cn-passport
    kind: id-documents
    label: TW_PASSPORT
    name: Chinese passport number
    about: 'Starts with `E`, or `E` and a letter, followed by 7 or 8 digits, with “护照” or “passport” in the 20 characters before it'
  - id: hk-macau-taiwan-id
    kind: id-documents
    label: TW_ID_NUMBER
    name: Hong Kong, Macau or Taiwan ID number
    about: 'Hong Kong, Macau and Taiwan ID numbers: Hong Kong and Taiwan ones with a correct check character; Macau ones only when the document is named just before'
  - id: mainland-travel-permit
    kind: id-documents
    label: TW_ID_NUMBER
    name: Mainland travel permit number
    about: 'Mainland travel permits for Hong Kong and Macau residents (`H` or `M` and 8 digits) and for Taiwan residents (8 digits), with “通行证”, “回乡证” or “台胞证” in the 20 characters before it'
  - id: us-ssn
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: US Social Security number
    about: 'A US Social Security number written as `ddd-dd-dddd`, excluding area, group and serial numbers never issued'
  - id: uk-nino
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: UK National Insurance number
    about: 'A UK National Insurance number: 2 letters, 6 digits and one of A to D, excluding letter pairs never issued'
  - id: sg-nric
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Singapore NRIC / FIN
    about: 'Starts with S, T, F or G, followed by 7 digits and a correct check letter'
  - id: kr-rrn
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Korean resident registration number
    about: 'A 6-digit birth date, `-` and 7 digits, with a valid date and an 8th digit from 1 to 8'
  - id: jp-my-number
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Japanese My Number
    about: '12 digits with a correct check digit, with “マイナンバー”, “個人番号” or “My Number” in the 20 characters before it'
  - id: in-aadhaar
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Indian Aadhaar number
    about: '12 digits (optionally in groups of four), the first from 2 to 9, passing the Verhoeff check'
  - id: br-cpf
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Brazilian CPF
    about: 'A Brazilian CPF written as `ddd.ddd.ddd-dd`, with both check digits correct'
  - id: iban
    kind: financial
    on_by_default: true
    label: TW_ACCOUNT_NUMBER
    name: 'IBAN'
    about: 'A country code, two check digits and the account number length set for that country, passing MOD 97-10; written in one run or in groups of four'
  - id: cn-landline
    kind: contact
    label: TW_PHONE
    name: Chinese mainland landline number
    about: 'A 2- or 3-digit area code starting with `0` and a 7- or 8-digit number, with a valid area code and brackets or a hyphen (`010-12345678`, `(0755)1234567`)'
  - id: intl-phone
    kind: contact
    label: TW_PHONE
    name: International phone number
    about: 'Starts with `+`, with a valid country code and the length set for that country; spaces and hyphens allowed'
  - id: cn-address
    kind: location
    label: TW_ADDRESS
    name: Chinese mainland street address
    about: 'A Chinese mainland street address: administrative area names, a street, road, lane or village, and a house number; addresses that stop at the district do not count'
  - id: geo-coordinates
    kind: location
    label: TW_LOCATION
    name: Precise coordinates
    about: 'A latitude and longitude pair within range, each with at least 5 decimal places'
  - id: cn-license-plate
    kind: vehicle
    label: TW_PLATE
    name: Chinese mainland license plate
    about: 'A province abbreviation, a letter and 5 letters or digits (6 for new-energy vehicles), without I or O'
  - id: vin
    kind: vehicle
    label: TW_VIN
    name: Vehicle identification number (VIN)
    about: '17 characters without I, O or Q, with a correct check character in position 9'
  - id: imei
    kind: device
    label: TW_DEVICE_ID
    name: 'IMEI'
    about: '15 digits passing the Luhn check, with “IMEI” in the 20 characters before it'
  - id: mac-address
    kind: device
    label: TW_DEVICE_ID
    name: MAC address
    about: '6 pairs of hex characters separated by `:` or `-`; all-zero, broadcast and multicast addresses excepted'
  - id: public-ip
    kind: device
    label: TW_IP
    name: Public IP address
    about: 'Public IPv4 and IPv6 addresses; private, loopback, link-local, carrier-grade NAT, documentation and multicast addresses excepted'
  - id: labeled-name
    kind: labeled-personal
    label: TW_NAME
    name: Name by field name
    about: 'The value of a field named `姓名`, `真实姓名`, `联系人`, `收件人`, `收货人`, `real_name`, `full_name`, `legal_name`, `first_name`, `last_name`, `given_name`, `family_name` or `name`, written as `name: value`, `"name": "value"` or under a table header; only the value is replaced'
  - id: labeled-address
    kind: labeled-personal
    label: TW_ADDRESS
    name: Address by field name
    about: 'The value of a field named `住址`, `家庭住址`, `收货地址`, `联系地址`, `home_address`, `shipping_address`, `residential_address` or `address`, written as `name: value`, `"name": "value"` or under a table header; only the value is replaced'
  - id: labeled-birth-date
    kind: labeled-personal
    label: TW_BIRTH_DATE
    name: Birth date by field name
    about: 'The value of a field named `出生日期`, `生日`, `birthday`, `birth_date`, `date_of_birth` or `dob`, written as `name: value`, `"name": "value"` or under a table header; only the value is replaced'
  - id: labeled-account
    kind: labeled-personal
    label: TW_ACCOUNT_NUMBER
    name: Bank account by field name
    about: 'The value of a field named `银行账号`, `开户账号`, `银行卡号`, `account_number`, `bank_account` or `bank_account_number`, written as `name: value`, `"name": "value"` or under a table header; only the value is replaced'
  - id: labeled-health
    kind: labeled-personal
    label: TW_HEALTH
    name: Health information by field name
    about: 'The value of a field named `病历号`, `住院号`, `诊断`, `病史`, `medical_record_number` or `diagnosis`, written as `name: value`, `"name": "value"` or under a table header; only the value is replaced'
