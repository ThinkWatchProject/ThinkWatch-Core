  # 按位置认的：只换值那一段
  - id: auth-header-credential
    kind: in-context
    on_by_default: true
    name: Credential in a request header
    name_zh: 请求头中的凭据
    about: 'The value of an `Authorization`, `X-Api-Key`, `Api-Key` or `X-Goog-Api-Key` header, in curl `-H`, raw HTTP or code; only the value is replaced'
    about_zh: '`Authorization`、`X-Api-Key`、`Api-Key`、`X-Goog-Api-Key` 请求头的值，包括 curl 的 `-H`、HTTP 原文与代码中的写法；只换值'
  - id: command-line-password
    kind: in-context
    on_by_default: true
    name: Password on a command line
    name_zh: 命令行中的口令
    about: 'Passwords on a command line: `curl -u user:password`, `--user`, `mysql -ppassword`, `PGPASSWORD=… psql`; only the password is replaced'
    about_zh: '命令行中的口令：`curl -u 用户:口令`、`--user`、`mysql -p口令`、`PGPASSWORD=… psql`；只换口令'
  - id: url-token
    kind: in-context
    on_by_default: true
    name: Token in a URL
    name_zh: URL 中的令牌
    about: 'The value of the URL query parameter `access_token`, `api_key`, `apikey`, `client_secret`, `sig`, `X-Amz-Signature` or `X-Goog-Signature`; only the parameter value is replaced'
    about_zh: 'URL 查询参数 `access_token`、`api_key`、`apikey`、`client_secret`、`sig`、`X-Amz-Signature`、`X-Goog-Signature` 的值；只换参数值'
  - id: bot-webhook
    kind: in-context
    on_by_default: true
    name: Bot webhook
    name_zh: 机器人 Webhook
    about: 'The token in a Feishu / Lark, DingTalk, WeCom, Slack, Discord or Microsoft Teams bot webhook URL; only the token is replaced'
    about_zh: '飞书 / Lark、钉钉、企业微信、Slack、Discord、Microsoft Teams 机器人 Webhook 地址中的令牌；只换令牌段'
  - id: telegram-bot-token
    kind: in-context
    on_by_default: true
    name: Telegram bot token
    name_zh: Telegram 机器人令牌
    about: '8 to 10 digits and `:AA`, followed by 33 characters'
    about_zh: '8 至 10 位数字与 `:AA`，其后 33 个字符'
  - id: config-assignment
    kind: in-context
    on_by_default: true
    name: Secret assigned in a config file
    name_zh: 配置文件中的密钥赋值
    about: 'Assignments in `.env`, YAML, TOML, INI or JSON whose variable name ends in `SECRET`, `SECRET_KEY`, `PASSWORD`, `PASSWD`, `PWD`, `TOKEN`, `API_KEY`, `APIKEY`, `ACCESS_KEY`, `PRIVATE_KEY` or `CLIENT_SECRET` (ignoring case) and whose value is a literal of at least 8 characters; only the value is replaced. Expressions, variable references and placeholders do not count'
    about_zh: '`.env`、YAML、TOML、INI、JSON 中变量名以 `SECRET`、`SECRET_KEY`、`PASSWORD`、`PASSWD`、`PWD`、`TOKEN`、`API_KEY`、`APIKEY`、`ACCESS_KEY`、`PRIVATE_KEY`、`CLIENT_SECRET` 结尾（不区分大小写）、值为至少 8 个字符的字面量的赋值；只换值，表达式、变量引用和占位写法不算'

  # 加密货币
  - id: crypto-mnemonic
    kind: crypto
    on_by_default: true
    name: Recovery phrase
    name_zh: 助记词
    about: '12, 15, 18, 21 or 24 consecutive words from the BIP39 English or Simplified Chinese word list that pass the checksum; numbering allowed, replaced as a whole'
    about_zh: '连续 12、15、18、21 或 24 个 BIP39 英文或简体中文词表中的词，并通过校验和；可带编号，整段'
  - id: crypto-wif-key
    kind: crypto
    on_by_default: true
    name: WIF private key
    name_zh: WIF 私钥
    about: 'A WIF private key of 51 or 52 characters that passes Base58Check with a valid version byte'
    about_zh: '51 或 52 个字符的 WIF 私钥：Base58Check 校验通过，版本字节对得上'
  - id: crypto-extended-key
    kind: crypto
    on_by_default: true
    name: Extended private key
    name_zh: 扩展私钥
    about: 'Starts with `xprv`, `tprv`, `yprv` or `zprv` and passes Base58Check'
    about_zh: '`xprv`、`tprv`、`yprv`、`zprv` 开头，Base58Check 校验通过'

  # ---- 扩充的个人信息规则（判据在 src/redact/personal/）
  - id: cn-resident-id-15
    kind: id-documents
    label: TW_ID_NUMBER
    name: 15-digit legacy resident ID number
    name_zh: 15 位旧身份证号
    about: 'A 15-digit legacy resident ID number with a valid region code and 6-digit birth date, followed by a 3-digit sequence'
    about_zh: '15 位旧身份证号：地区码、6 位出生日期都对得上，其后 3 位顺序码'
  - id: passport-mrz
    kind: id-documents
    on_by_default: true
    label: TW_PASSPORT
    name: Passport machine-readable zone
    name_zh: 护照机读区
    about: 'Two lines of 44 characters starting with `P`, with all four check digits and the composite check digit correct; replaced as a whole'
    about_zh: '两行各 44 个字符、以 `P` 开头，四处校验位与综合校验位都对得上；整段'
  - id: cn-passport
    kind: id-documents
    label: TW_PASSPORT
    name: Chinese passport number
    name_zh: 中国护照号
    about: 'Starts with `E`, or `E` and a letter, followed by 7 or 8 digits, with “护照” or “passport” in the 20 characters before it'
    about_zh: '`E` 或 `E` 加一个字母开头、其后 7 至 8 位数字，且前 20 个字符内出现「护照」或「passport」'
  - id: hk-macau-taiwan-id
    kind: id-documents
    label: TW_ID_NUMBER
    name: Hong Kong, Macau or Taiwan ID number
    name_zh: 港澳台身份证号
    about: 'Hong Kong, Macau and Taiwan ID numbers: Hong Kong and Taiwan ones with a correct check character; Macau ones only when the document is named just before'
    about_zh: '香港、澳门、台湾身份证号：香港、台湾的校验码对得上；澳门的须前文写明证件名称'
  - id: mainland-travel-permit
    kind: id-documents
    label: TW_ID_NUMBER
    name: Mainland travel permit number
    name_zh: 港澳台往来内地通行证号
    about: 'Mainland travel permits for Hong Kong and Macau residents (`H` or `M` and 8 digits) and for Taiwan residents (8 digits), with “通行证”, “回乡证” or “台胞证” in the 20 characters before it'
    about_zh: '港澳居民来往内地通行证（`H` 或 `M` 加 8 位数字）与台湾居民来往大陆通行证（8 位数字），且前 20 个字符内出现「通行证」「回乡证」或「台胞证」'
  - id: us-ssn
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: US Social Security number
    name_zh: 美国社会安全号
    about: 'A US Social Security number written as `ddd-dd-dddd`, excluding area, group and serial numbers never issued'
    about_zh: '`ddd-dd-dddd` 写法的美国社会安全号，不会分配的区号、组号与序号除外'
  - id: uk-nino
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: UK National Insurance number
    name_zh: 英国国民保险号
    about: 'A UK National Insurance number: 2 letters, 6 digits and one of A to D, excluding letter pairs never issued'
    about_zh: '2 个字母、6 位数字与 A 至 D 之一组成的英国国民保险号，不会分配的字母组合除外'
  - id: sg-nric
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Singapore NRIC / FIN
    name_zh: 新加坡 NRIC / FIN
    about: 'Starts with S, T, F or G, followed by 7 digits and a correct check letter'
    about_zh: 'S、T、F、G 之一开头，7 位数字加校验字母，校验字母对得上'
  - id: kr-rrn
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Korean resident registration number
    name_zh: 韩国居民登录号
    about: 'A 6-digit birth date, `-` and 7 digits, with a valid date and an 8th digit from 1 to 8'
    about_zh: '6 位出生日期、`-` 与 7 位数字，日期有效、第 8 位为 1 至 8'
  - id: jp-my-number
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Japanese My Number
    name_zh: 日本个人番号
    about: '12 digits with a correct check digit, with “マイナンバー”, “個人番号” or “My Number” in the 20 characters before it'
    about_zh: '12 位数字，校验位对得上，且前 20 个字符内出现「マイナンバー」「個人番号」或「My Number」'
  - id: in-aadhaar
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Indian Aadhaar number
    name_zh: 印度 Aadhaar 号码
    about: '12 digits (optionally in groups of four), the first from 2 to 9, passing the Verhoeff check'
    about_zh: '12 位数字（可四位一组），首位为 2 至 9，Verhoeff 校验通过'
  - id: br-cpf
    kind: foreign-ids
    label: TW_ID_NUMBER
    name: Brazilian CPF
    name_zh: 巴西 CPF
    about: 'A Brazilian CPF written as `ddd.ddd.ddd-dd`, with both check digits correct'
    about_zh: '`ddd.ddd.ddd-dd` 写法的巴西 CPF，两位校验码对得上'
  - id: iban
    kind: financial
    on_by_default: true
    label: TW_ACCOUNT_NUMBER
    name: 'IBAN'
    name_zh: 国际银行账号（IBAN）
    about: 'A country code, two check digits and the account number length set for that country, passing MOD 97-10; written in one run or in groups of four'
    about_zh: '国家代码、两位校验码与该国规定位数的账号，MOD 97-10 校验通过；连写或四位一组'
  - id: cn-landline
    kind: contact
    label: TW_PHONE
    name: Chinese mainland landline number
    name_zh: 中国大陆固定电话
    about: 'A 2- or 3-digit area code starting with `0` and a 7- or 8-digit number, with a valid area code and brackets or a hyphen (`010-12345678`, `(0755)1234567`)'
    about_zh: '`0` 开头的 2 至 3 位区号加 7 至 8 位号码，区号有效，须带括号或连字符（`010-12345678`、`(0755)1234567`）'
  - id: intl-phone
    kind: contact
    label: TW_PHONE
    name: International phone number
    name_zh: 国际电话号码
    about: 'Starts with `+`, with a valid country code and the length set for that country; spaces and hyphens allowed'
    about_zh: '`+` 开头，国家码有效、位数与该国规定一致；可带空格与连字符'
  - id: cn-address
    kind: location
    label: TW_ADDRESS
    name: Chinese mainland street address
    name_zh: 中国大陆详细地址
    about: 'A Chinese mainland street address: administrative area names, a street, road, lane or village, and a house number; addresses that stop at the district do not count'
    about_zh: '行政区划名称、街道路巷村之一与门牌号（号、栋、单元、室）组成的中国大陆详细地址；只到区县的不算'
  - id: geo-coordinates
    kind: location
    label: TW_LOCATION
    name: Precise coordinates
    name_zh: 精确坐标
    about: 'A latitude and longitude pair within range, each with at least 5 decimal places'
    about_zh: '成对出现、在取值范围内、小数不少于 5 位的纬度与经度'
  - id: cn-license-plate
    kind: vehicle
    label: TW_PLATE
    name: Chinese mainland license plate
    name_zh: 中国大陆车牌号
    about: 'A province abbreviation, a letter and 5 letters or digits (6 for new-energy vehicles), without I or O'
    about_zh: '省份简称、字母与 5 位字母或数字（新能源车为 6 位），不含 I、O'
  - id: vin
    kind: vehicle
    label: TW_VIN
    name: Vehicle identification number (VIN)
    name_zh: 车辆识别代号（VIN）
    about: '17 characters without I, O or Q, with a correct check character in position 9'
    about_zh: '17 个字符、不含 I、O、Q，第 9 位校验码对得上'
  - id: imei
    kind: device
    label: TW_DEVICE_ID
    name: 'IMEI'
    name_zh: 'IMEI'
    about: '15 digits passing the Luhn check, with “IMEI” in the 20 characters before it'
    about_zh: '15 位数字，Luhn 校验通过，且前 20 个字符内出现「IMEI」'
  - id: mac-address
    kind: device
    label: TW_DEVICE_ID
    name: MAC address
    name_zh: MAC 地址
    about: '6 pairs of hex characters separated by `:` or `-`; all-zero, broadcast and multicast addresses excepted'
    about_zh: '6 组两位十六进制字符，以 `:` 或 `-` 分隔；全零、广播与组播地址除外'
  - id: public-ip
    kind: device
    label: TW_IP
    name: Public IP address
    name_zh: 公网 IP 地址
    about: 'Public IPv4 and IPv6 addresses; private, loopback, link-local, carrier-grade NAT, documentation and multicast addresses excepted'
    about_zh: '公网 IPv4、IPv6 地址；私有、回环、链路本地、运营商级 NAT、文档示例与组播地址除外'
  - id: labeled-name
    kind: labeled-personal
    label: TW_NAME
    name: Name by field name
