[package]
name = "tw-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "控制面 API 服务端（unix socket）"

[dependencies]
tw-api = { workspace = true }
tw-config = { workspace = true }
tw-engine = { workspace = true }
tw-gateway = { workspace = true }
tw-observe = { workspace = true }
