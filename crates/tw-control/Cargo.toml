[package]
name = "tw-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Control-plane API server over a unix socket"

[dependencies]
tw-api = { workspace = true }
# 列网卡用 getifaddrs —— 比引一个 crate 便宜
libc = { workspace = true }
tw-config = { workspace = true }
tw-adopt = { workspace = true }
# 更新那份价目表时给下载内容按指纹 —— 用户看的 diff 和落盘的必须是同一份
blake3 = { workspace = true }
tw-scan = { workspace = true }
tw-redact = { workspace = true }
bytes = { workspace = true }
tw-engine = { workspace = true }
tw-gateway = { workspace = true }
tw-observe = { workspace = true }
tw-secret = { workspace = true }
tw-store = { workspace = true }
tw-pricing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tw-yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tw-yaml = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = "3"
tw-observe = { workspace = true }
tw-api = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
