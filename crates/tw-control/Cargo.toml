[package]
name = "tw-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Control-plane API server over a unix socket"

[dependencies]
tw-api = { workspace = true }
tw-types = { workspace = true }
# 列网卡用 getifaddrs —— 比引一个 crate 便宜
libc = { workspace = true }
# 生成控制面的凭据
rand = { workspace = true }
tw-config = { workspace = true }
tw-adopt = { workspace = true }
tw-scan = { workspace = true }
tw-guard = { workspace = true }
bytes = { workspace = true }
tw-engine = { workspace = true }
tw-gateway = { workspace = true }
tw-observe = { workspace = true }
tw-secret = { workspace = true }
tw-store = { workspace = true }
tw-pricing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tw-yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 契约测试按 tw-api 的类型拼查询串，和客户端一样
serde_urlencoded = "0.7"
# 测试里的假 OpenAI：拼 id_token、核对 PKCE
base64 = { workspace = true }
sha2 = { workspace = true }
tw-yaml = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = "3"
tw-observe = { workspace = true }
tw-api = { workspace = true }
tw-types = { workspace = true }
# 网卡那条断言要对着本机真实的清单比，不写死某个平台的名字
tw-config = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
