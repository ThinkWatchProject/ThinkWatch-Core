[package]
name = "tw-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Runs one script plugin's hooks inside a WebAssembly sandbox (QuickJS in Wasmtime)"

# **只有 tw-gateway 和 twcore 能依赖这个 crate。**编它要一个能出 wasm 的 clang
# （见 build.rs），而桌面端从 git 编 tw-api、tw-types 这些、企业版编第一层时都
# 不该被拖着要 clang —— tests/boundary.rs 守着这条。

[dependencies]
# **只有运行时**：没有 Cranelift，没有池分配器。沙箱的机器码在 build.rs 里预编译
# 好、嵌进二进制。版本钉死，并且和下面构建依赖里的是同一个：预编译产物只肯在
# 同一版本的 Wasmtime 里加载
wasmtime = { version = "=49.0.1", default-features = false, features = ["runtime", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
# 量线程的 CPU 时间（CLOCK_THREAD_CPUTIME_ID）
libc = { workspace = true }

[build-dependencies]
# 构建时的编译器：Cranelift 把快照编成目标平台的机器码；all-arch 让交叉编译
# （比如在 x64 上编 aarch64 的 Windows）也能编
wasmtime = { version = "=49.0.1", default-features = false, features = ["runtime", "std", "cranelift", "all-arch", "parallel-compilation"] }
# 改写快照的数据段。和 Wasmtime 49 自己用的是同一版
wasmparser = "0.258"
wasm-encoder = "0.258"
sha2 = { workspace = true }
# Windows 上问 cargo metadata 要 rquickjs-sys 的位置（见 build.rs）
serde_json = { workspace = true }

[dev-dependencies]
# 示例插件的测试按北京时间算「今天」
chrono = { workspace = true }
