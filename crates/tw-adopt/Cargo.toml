[package]
name = "tw-adopt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Detect local AI clients, take over their configuration, and restore it"

[dependencies]
serde = { workspace = true }
tw-config = { path = "../tw-config" }
tw-types = { workspace = true }
# 数据目录在哪由契约层回答，见 `tw_api::data`
tw-api = { workspace = true }
tw-yaml = { path = "../tw-yaml" }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 原子替换一个已存在的文件：`rename` 在这个平台上做不到，见 foreign.rs
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # 同名环境变量设在哪儿：注册表，见 detect.rs
    "Win32_System_Registry",
    # 客户端进程什么时候起的：枚举进程 + 取创建时刻，见 detect.rs
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
