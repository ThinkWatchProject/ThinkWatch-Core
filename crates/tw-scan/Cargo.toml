[package]
name = "tw-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Static scan of client configuration for hidden characters, prompt injection, dangerous commands, and overly broad permissions"

[dependencies]
serde = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tw-adopt = { workspace = true }
tw-config = { workspace = true }
tw-types = { workspace = true }
tw-guard = { workspace = true }
tw-watch = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
