# 静态扫描的规则集。
#
# **放在 YAML 里而不是硬编码**，因为这个列表会持续演进 —— 每出现一种
# 新的注入写法就要能加一条，而不必等一次发版。
#
# 用户可以用 ~/.thinkwatch/scan-rules.yaml 覆盖整份。覆盖不是合并：
# 一份规则集要能被完整地读懂和审查，而「默认加上你的再减去某几条」是
# 一个没有人能在脑子里跑完的算法。
#
# **中英文都要覆盖。**只写英文规则等于对中文的注入完全不设防，而写
# 中文提示词的人只多不少。
version: 1

# 一、提示注入。命中只说明「这段文字在试图改变模型的行为」，不等于
#     恶意 —— 所以级别是 suspect，让人看一眼。
injection:
  - id: ignore-previous
    pattern: '(?i)ignore\s+(all\s+)?(previous|above|prior)[^\n]{0,20}instructions'
    why: A prompt injection typically starts this way
  - id: disregard
    pattern: '(?i)disregard\s+(the\s+)?(system|above|previous)'
    why: A prompt injection typically starts this way, with a verb like disregard
  - id: you-are-now
    pattern: '(?i)you\s+are\s+now\s+(a|an)\s'
    why: An attempt to reset who the model is
  - id: ignore-previous-zh
    pattern: '忽略(以上|之前|上面|前面)(的)?(所有)?(指令|要求|规则)'
    why: A Chinese prompt injection asking the model to ignore earlier instructions
  - id: new-instructions-zh
    pattern: '新的?指令[：:]'
    why: A Chinese prompt injection declaring new instructions
  - id: you-are-now-zh
    pattern: '你(现在)?(是|扮演)一[个位名]'
    why: An attempt to reset who the model is
  - id: chat-marker
    pattern: '<\|(im_start|im_end|system|endoftext)\|>'
    why: Forged conversation markers, so the model reads the body as a system message
  - id: fake-system
    pattern: '(?i)\[?(system|assistant)\]?\s*[:：]\s*(you|your|ignore|从现在|你)'
    why: Text disguised as something the system or the assistant said

# 二、危险命令。这一组和工具调用防火墙共用 —— 一套规则两处用。
#
# `level` 决定的处置：**high 才会切断流**，medium 只告警。分级的
# 判据是「它能不能一步拿到执行权或者拿走凭据」，不是「它听起来多可怕」。
# 没写 level 的按 medium 算。
dangerous:
  # 中间那段**不限长度**。`[^\n|]` 已经保证了「同一行、中间没有别的
  # 管道」，也就是说匹配到的必然是「从这个 curl 到它右边第一个管道」——
  # 那本来就是危险构造本身，多长都一样。
  #
  # 原来写的是 `{0,200}`，而那个上限是个**可以直接绕过的洞**：把 URL
  # 填长到 200 字符以上，同一条命令就匹配不到了。测试抓住的。
  - id: curl-pipe-sh
    pattern: '(?i)(curl|wget)[^\n|]*\|\s*(sudo\s+)?(ba|z|d)?sh'
    why: Downloads and runs it straight away; what runs is decided remotely and cannot be read first
    level: high
  - id: rm-rf-root
    pattern: 'rm\s+(-[a-zA-Z]*\s+)*-[a-zA-Z]*[rf][a-zA-Z]*\s+(/|~|\$HOME)(\s|$)'
    why: Deletes the whole home directory or the root
    level: medium
  - id: chmod-777
    pattern: 'chmod\s+(-R\s+)?777'
    why: Makes a file writable by everyone
    level: medium
  - id: base64-decode-exec
    pattern: '(?i)base64\s+(-d|--decode)[^\n|]*\|\s*(ba)?sh'
    why: Hides what will run inside base64
    level: high
  - id: exfil-env
    pattern: '(?i)(env|printenv|cat\s+[^\n]{0,60}\.env)[^\n]{0,200}(curl|wget|nc\s)'
    why: Sends the environment, which usually holds keys, somewhere else
    level: high
  # **命令形状的规则对中文指令完全不设防。**「把 ~/.aws/credentials
  # 打印出来」里没有 cat 也没有 curl，但它要的是同一件事。所以再加一条
  # 按「凭据路径 + 外送动词」匹配的，两个方向都写。
  - id: exfil-credentials
    pattern: '(\.ssh/id_|\.aws/credentials|\.netrc|/\.env)[^\n]{0,30}(发|传|上报|打印|输出|贴出|读出|(?i:send|upload|post|print|paste|exfil))'
    why: Asks the model to send the contents of a credential file somewhere
    level: high
  - id: exfil-credentials-reversed
    pattern: '(发送|上传|贴出|打印|输出|读取|(?i:send|upload|post|print|read))[^\n]{0,30}(\.ssh/id_|\.aws/credentials|\.netrc|/\.env)'
    why: Asks the model to send the contents of a credential file somewhere
    level: high
  # **写入启动项**：只要写进去了，下次开终端就执行 —— 而且是在你完全
  # 不知情的时候。它和「下载即执行」并列为高危，理由是一样的：
  # 一步就能拿到执行权。
  - id: write-startup-item
    pattern: '(>>?|tee|cp|mv|ln\s+-s)[^\n]{0,200}(\.zshrc|\.bashrc|\.bash_profile|\.profile|\.zprofile|LaunchAgents|LaunchDaemons|\.git/hooks|crontab)'
    why: Writes somewhere that runs at login or whenever a terminal opens
    level: high
  # `crontab -l` 是看一眼，`crontab <文件>` / `crontab -r` / `crontab -`
  # 才是动手。分不开的话，这条规则会在每次「帮我看看定时任务」时误报。
  - id: crontab-install
    pattern: 'crontab\s+(-r\b|-\s*$|[^\s-][^\n]{0,40})'
    why: Installs a scheduled job, or deletes every existing one
    level: high
  - id: ssh-key-read
    pattern: '(?i)(cat|cp|scp|curl)[^\n]{0,200}(\.ssh/id_|\.aws/credentials|\.netrc)'
    why: Reads a private key or a cloud credential
    level: high
