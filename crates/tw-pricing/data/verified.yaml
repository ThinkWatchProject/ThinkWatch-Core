# 人工核对过的价格（「发版前核对官方定价页」）。
#
# **任何第三方数据源都会滞后。**一个实测到的例子：OpenAI 在 2026-08-22
# 下调了某个模型的价格，某个广泛使用的数据集三天后才修正，中间一直返回
# 偏高 25% 的价格。根因是那家的同步脚本只自动同步模型清单，价格靠人工 PR。
#
# 所以内置快照要和**厂商官方定价页**对一遍 —— 不是和另一个第三方数据集
# 对，那只是把赌注换个地方押。
#
# ## 这份文件怎么用
#
# `crates/tw-pricing` 里有一条测试逐条比对它和内置快照。**对不上就构建
# 失败** —— 那是挡住「打包了错数据」的唯一手段。
#
# 换快照之后测试红了，说明上游改了价。这时要做的**不是**改这份文件让它
# 闭嘴，而是：
#
#   1. 打开下面那个官方定价页，看新价格对不对；
#   2. 对得上就改这里的数字并更新 `checked_on`；
#   3. 对不上就说明上游数据集错了 —— 用 `pricing.yaml` 的覆盖层顶住，
#      并去上游提 issue。
#
# ## 和原计划不同的一处取舍
#
# 本来的设想是「CI 拉取官方定价页逐条比对」。这里没有那么做：抓一个
# 会改版的 HTML 页面，会让 CI 在厂商换个 div 的那天变红，而那种红和
# 「价格真的错了」长得一模一样 —— 一个天天误报的检查，第二周就没人看了。
#
# 换成「人工核对一次、日期写下来、机器盯着别漂」：机器管的是它擅长的
# （一个字节都不许变），人管的是它擅长的（这个数字对不对）。

# ## ⚠️ 这份文件现在还没有被人核对过
#
# `pending_human_verification: true` 说的就是这件事。**下面的数字是从
# 内置快照里抄下来的**，不是从厂商定价页上抄的 —— 所以那条比对测试现在
# 只能抓住「快照漂了」，抓不住「快照一开始就错了」。
#
# 把这个字段改成 false 之前，请真的打开下面那两个页面对一遍。**不要因为
# 测试是绿的就以为对过了** —— 那正是这一节警告的「把赌注换个地方押」。
pending_human_verification: true

# 单位：每百万 token 的美元
checked_on: "2026-09-09"
sources:
  anthropic: https://www.anthropic.com/pricing
  openai: https://openai.com/api/pricing/

