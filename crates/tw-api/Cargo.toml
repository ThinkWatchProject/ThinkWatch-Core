[package]
name = "tw-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Control-plane contract: request and response types, plus a client"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# `Msg` 住在 tw-types：会造消息的 crate 有一半够不着 tw-api（tw-config 只依赖
# tw-types，桌面端的接管 crate 也是），而契约这一层反过来依赖它没有问题 ——
# tw-types 自己零依赖。
tw-types = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# 把契约导出成 TypeScript：`tw_api::ts::export_all(dir)`。**默认关** ——
# 只有桌面端生成前端类型时开，core 自己和企业版都不背 ts-rs。
ts = ["dep:ts-rs", "tw-types/ts"]

[[example]]
name = "export_ts"
required-features = ["ts"]
