[package]
name = "tw-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "YAML config schema, loading, and validation"

[dependencies]
tw-engine = { workspace = true }
tw-types = { workspace = true }
tw-secret = { workspace = true }
# 校验要认得出配置里写到的内置脱敏规则 id
tw-redact = { workspace = true }
regex = { workspace = true }
tw-pricing = { workspace = true }
# 凭据轮换要把一个标量写回 config.yaml。**span 补丁，不是
# serde 往返** —— 往返会把用户的注释和排版全洗掉
tw-yaml = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
notify = { workspace = true }
# 网卡枚举：`bind` 认网卡名，要问系统它现在是哪个地址。
# getifaddrs 一共不到五十行，不值得引第三方 crate
libc = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    # IP_ADAPTER_ADDRESSES_LH 挂在这个 feature 下，不是 IpHelper 下
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # 建数据目录时带上 ACL，见 private_dir
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
