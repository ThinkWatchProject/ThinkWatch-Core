[package]
name = "tw-upstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Talking to an upstream: URL assembly and header handling, shared by both gateways"

[dependencies]
# HeaderMap 和 HeaderName。**不要 axum 也不要 reqwest** —— 共享层不该
# 规定下游用哪个 HTTP 框架，而两者的 HeaderMap 本来就都是这个 crate 的
http = "1"
reqwest = { workspace = true }

# ── Bedrock：SigV4 签名、eventstream 拆帧。桌面版不接它 ─────────
# 这一串会连同一个 http 0.2 一起进来，所以关在 feature 后面
aws-sigv4 = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-smithy-eventstream = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
bedrock = [
    "dep:aws-sigv4",
    "dep:aws-credential-types",
    "dep:aws-smithy-eventstream",
    "dep:bytes",
    "dep:serde_json",
]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
aws-smithy-types = { workspace = true }
# 从线上的二进制帧一路走到客户端格式，证明拆帧和方言的约定对得上
tw-dialect = { workspace = true }
tw-wire = { workspace = true }

[[test]]
name = "bedrock_stream"
required-features = ["bedrock"]
