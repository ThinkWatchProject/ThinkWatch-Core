# 发一版 twcore 的二进制。
#
# **它存在的理由是桌面版。**桌面版的 `.app` 里要装一份 twcore，而
# 「装的是哪一版」必须是钉死、可复核的 —— 从隔壁仓库的 target 目录复制
# 一份过去，等于把「发出去的是什么」交给那台机器当时的状态。
#
# 这条流水线不重跑那四道门：tag 是从 main 上打的，而 main 上的每一个
# commit 都过过 `ci.yml`。这里只做 CI 做不了的那件事 —— 产出一个别人
# 能下载、能校验的文件。
name: Release

on:
  push:
    tags: ["v*"]
  # **排练。**手工触发时照常构建、照常自检，但什么都不发。
  #
  # 理由是这条流水线唯一一个「发现了也没法在本次补救」的性质：tag 一旦
  # 推上去，流水线错了就得把它撤回来。而这里新增的那条 Windows 支线要靠
  # 交叉编译到 arm64，那件事成不成只有真跑一次才知道 —— 用一个 tag 去
  # 问这个问题太贵了。
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  twcore:
    name: twcore (aarch64-apple-darwin)
    # 只发 Apple Silicon。**不是「暂时」** —— 覆盖不到的那部分机器，
    # 拿到的是一个能下载但打不开的文件，而那比没有更糟；真要支持 Intel
    # 就得做通用二进制，那是另一个决定。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p twcore --target aarch64-apple-darwin

      # **产物自检。**一个编得过但起不来的二进制，从文件列表上看不出
      # 任何问题 —— 而它会一路发到用户手里。
      - name: It runs, and it is the version on the tag
        run: |
          set -euo pipefail
          BIN=target/aarch64-apple-darwin/release/twcore
          file "$BIN" | grep -q arm64
          GOT=$("$BIN" --version | awk '{print $2}')
          # 排练时没有 tag 可对，只把版本打出来
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            WANT="${GITHUB_REF_NAME#v}"
            if [ "$GOT" != "$WANT" ]; then
              echo "tag 是 $WANT，而二进制报的是 $GOT —— Cargo.toml 的版本没跟上" >&2
              exit 1
            fi
          else
            echo "排练：二进制报的是 $GOT"
          fi
          "$BIN" --help > /dev/null

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/twcore dist/twcore-aarch64-apple-darwin
          cd dist
          shasum -a 256 twcore-aarch64-apple-darwin > twcore-aarch64-apple-darwin.sha256
          cat twcore-aarch64-apple-darwin.sha256

      - uses: softprops/action-gh-release@v2
        # 排练不发布。
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/twcore-aarch64-apple-darwin
            dist/twcore-aarch64-apple-darwin.sha256
          # 发布说明留空，从 tag 的信息里来 —— 让一份自动生成的清单
          # 冒充发布说明，读的人得不到任何东西
          generate_release_notes: true

  twcore-windows:
    name: twcore (Windows x64 + arm64)
    # **两个架构都发**（x64 和 arm64）。x64 原生编，arm64 在同一台 x64
    # runner 上交叉编 —— MSVC 的 ARM64 工具链在这个镜像里，而起一台
    # arm64 runner 只为编一个二进制不划算。
    #
    # 交叉编译成不成，靠上面那个排练模式先问清楚，而不是拿一个 tag 去问。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release -p twcore --target x86_64-pc-windows-msvc
          cargo build --release -p twcore --target aarch64-pc-windows-msvc

      # **产物自检。**一个编得过但起不来的二进制，从文件列表上看不出任何
      # 问题 —— 而它会一路发到用户手里。
      #
      # arm64 那个在这台机器上跑不起来（x64 runner），所以只能查它到底是不是
      # arm64 —— 读 PE 头里的 machine 字段，等价于 macOS 那边的 `file | grep
      # arm64`。**这一条不是走过场**：交叉编译配错目标的表现正是产出一个
      # 名字叫 arm64 的 x64 二进制。
      - name: They are what they claim to be, and the x64 one runs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine([string]$path) {
            $fs = [System.IO.File]::OpenRead($path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x00004550) { throw "$path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $want = @{
            "target\x86_64-pc-windows-msvc\release\twcore.exe"  = 0x8664
            "target\aarch64-pc-windows-msvc\release\twcore.exe" = 0xAA64
          }
          foreach ($p in $want.Keys) {
            $got = Get-PeMachine $p
            if ($got -ne $want[$p]) {
              throw ("{0} is machine 0x{1:X4}, expected 0x{2:X4}" -f $p, $got, $want[$p])
            }
            Write-Host ("{0}: 0x{1:X4}" -f $p, $got)
          }

          $exe = "target\x86_64-pc-windows-msvc\release\twcore.exe"
          $got = (& $exe --version).Split(" ")[1]
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $wantVer = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($got -ne $wantVer) {
              throw "the tag says $wantVer but the binary reports $got -- Cargo.toml did not keep up"
            }
          } else {
            Write-Host "rehearsal: the binary reports $got"
          }
          & $exe --help | Out-Null

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($t in @("x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc")) {
            $out = "dist\twcore-$t.exe"
            Copy-Item "target\$t\release\twcore.exe" $out
            # **和 macOS 那边同一种校验文件**：`<sha>  <文件名>`，两列，
            # 两个空格 —— 下载的人用同一条 shasum -c 就能核。
            $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
            "$h  twcore-$t.exe" | Set-Content -NoNewline -Encoding ascii "$out.sha256"
            Get-Content "$out.sha256"
          }

      - uses: softprops/action-gh-release@v2
        # 排练不发布。
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/twcore-x86_64-pc-windows-msvc.exe
            dist/twcore-x86_64-pc-windows-msvc.exe.sha256
            dist/twcore-aarch64-pc-windows-msvc.exe
            dist/twcore-aarch64-pc-windows-msvc.exe.sha256
          generate_release_notes: true

  twcore-linux:
    name: twcore (${{ matrix.target }})
    # **两个架构都原生编**，各在自己架构的 runner 上 —— 交叉编 aarch64 要
    # 一套 aarch64 的 glibc sysroot 和链接器，而 GitHub 给公开仓库提供了
    # arm64 的 Linux runner（`ubuntu-22.04-arm`），原生编还能顺手把产物
    # 跑一遍，交叉编的跑不了。
    #
    # **两个都是 22.04，不是 24.04。**glibc 只向后兼容：在 2.39（24.04）上
    # 链出来的二进制，拿到 2.35（22.04）上会报 `GLIBC_2.38 not found` 起不来。
    # 桌面版在 Linux 上的底线就是 22.04（WebKitGTK 4.1），core 跟它对齐。
    #
    # **不用 musl 静态编。**它能摆脱 glibc 版本，但桌面版本体反正要 glibc
    # 2.35+，core 单独摆脱它换不来什么；而 musl 的内存分配器在多线程下慢得
    # 多、DNS 解析的行为和 glibc 不同 —— 用户机器上出了问题，排查的是一个
    # 和系统里其他程序都不一样的运行时。同一个 glibc 底线，排查也简单。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            file_arch: x86-64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            file_arch: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p twcore --target ${{ matrix.target }}

      # **产物自检。**一个编得过但起不来的二进制，从文件列表上看不出任何
      # 问题 —— 而它会一路发到用户手里。
      #
      # 比 macOS 那段多一条 glibc 的上限：runner 的镜像哪天换了、或者有人把
      # 上面的 22.04 改成了 latest，产物就会悄悄要求一个更新的 glibc，而在
      # 构建机上它照样跑得起来 —— 只有用户的 22.04 上起不来。
      - name: It runs, it is the version on the tag, and it needs glibc 2.35 at most
        env:
          FILE_ARCH: ${{ matrix.file_arch }}
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/twcore
          file "$BIN"
          file "$BIN" | grep -q "$FILE_ARCH"

          MAX_GLIBC=2.35
          NEED=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          if [ -z "$NEED" ]; then
            echo "objdump found no GLIBC_ symbol versions in $BIN" >&2
            exit 1
          fi
          echo "needs glibc $NEED (limit $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$MAX_GLIBC" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
            echo "twcore needs glibc $NEED, newer than $MAX_GLIBC (Ubuntu 22.04)" >&2
            exit 1
          fi

          GOT=$("$BIN" --version | awk '{print $2}')
          # 排练时没有 tag 可对，只把版本打出来
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            WANT="${GITHUB_REF_NAME#v}"
            if [ "$GOT" != "$WANT" ]; then
              echo "the tag says $WANT but the binary reports $GOT -- Cargo.toml did not keep up" >&2
              exit 1
            fi
          else
            echo "rehearsal: the binary reports $GOT"
          fi
          "$BIN" --help > /dev/null

      # **两种形态。**裸二进制给桌面版的流水线和 `twcore upgrade`（它们只要
      # 那一个文件）；压缩包给服务器上的首次安装（`scripts/install.sh`）：
      # 里面还有 systemd unit，装的 unit 和装的二进制出自同一个 commit。
      # 压缩包还保住了可执行位 —— 裸文件下载下来是 0644。
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # 压缩包里的目录和裸二进制同名，所以在 dist 外面搭
          STAGE="$RUNNER_TEMP/stage/twcore-$TARGET"
          mkdir -p dist "$STAGE"
          cp "target/$TARGET/release/twcore" "dist/twcore-$TARGET"
          install -m 0755 "target/$TARGET/release/twcore" "$STAGE/twcore"
          install -m 0644 packaging/systemd/twcore.service LICENSE "$STAGE/"
          tar -czf "dist/twcore-$TARGET.tar.gz" --owner=0 --group=0 -C "$RUNNER_TEMP/stage" "twcore-$TARGET"
          cd dist
          # 和另外两个平台同一种校验文件：`<sha>  <文件名>`
          sha256sum "twcore-$TARGET" > "twcore-$TARGET.sha256"
          sha256sum "twcore-$TARGET.tar.gz" > "twcore-$TARGET.tar.gz.sha256"
          cat ./*.sha256
          tar -tzvf "twcore-$TARGET.tar.gz"

      # 装脚本认的就是这个布局，这里照着它的步骤解一遍、跑一遍 —— 布局改了
      # 而脚本没跟上，在这里就挂，而不是在用户的服务器上。
      - name: The archive is what install.sh expects
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          (cd dist && sha256sum -c "twcore-$TARGET.tar.gz.sha256")
          tar -xzf "dist/twcore-$TARGET.tar.gz" -C "$T"
          test -x "$T/twcore-$TARGET/twcore"
          test -f "$T/twcore-$TARGET/twcore.service"
          "$T/twcore-$TARGET/twcore" --version

      - uses: softprops/action-gh-release@v2
        # 排练不发布。
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/twcore-${{ matrix.target }}
            dist/twcore-${{ matrix.target }}.sha256
            dist/twcore-${{ matrix.target }}.tar.gz
            dist/twcore-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
