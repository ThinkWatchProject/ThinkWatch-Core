# 每次改动都要过的那几关。
#
# **价目表的比对在这里**（DESIGN.md §4.3.0）：内置快照和
# `crates/tw-pricing/data/verified.yaml` 对不上就构建失败 —— 那是挡住
# 「打包了错数据」的唯一手段。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 这个项目把警告当错误。**在 CI 上放松这一条，等于把它取消**
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 默认不跑打真实网络的那些（它们标了 #[ignore]）—— CI 上的网络
      # 抖动会变成一条和代码无关的红，而那种红看几次就没人看了。
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p twcore

      # **接缝上的失败模式单元测试看不见**：文件权限、socket、某个端点
      # 在真二进制上根本没注册。这个项目的前四个真 bug 都是这么被逮到的
      # （DESIGN.md §9.7）。脚本自己会 build，这一步只是跑它。
      - name: Smoke (real binary, real socket, real data plane)
        run: ./scripts/smoke.sh
