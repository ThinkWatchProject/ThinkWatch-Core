[package]
name = "twcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-contained local AI gateway binary, and the engine behind ThinkWatch Lite"

[dependencies]
tw-config = { workspace = true }
tw-control = { workspace = true }
tw-gateway = { workspace = true }
tw-yaml = { workspace = true }
tw-api = { workspace = true }
tw-observe = { workspace = true }
tw-store = { workspace = true }
tw-pricing = { workspace = true }
chrono = { workspace = true }
tw-secret = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tw-adopt = { workspace = true }
tw-scan = { workspace = true }
tw-guard = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# `twcore call`：握手之后在加密的流上说 HTTP，和桌面端一样
tw-link = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
tracing-subscriber = { workspace = true }
# `twcore upgrade`：问 Release、下载、核对校验和。都是依赖树里已有的
reqwest = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# 只剩一处在用：问一个 pid 还在不在（见 src/proc.rs）
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# `twcore upgrade` 的测试对着一个假的 GitHub 跑
axum = { workspace = true }
serde_json = { workspace = true }
